<body class="app auth-page"><a class="visually-hidden-focusable skip-link" href="#auth-form">Skip to sign-in form</a>
    <main class="login-wrap" id="auth-form">
        <div class="login-content"> <a href="index.html" class="auth-brand" aria-label="AlumniConnect home">
                <span class="logo-mark" aria-hidden="true">C</span>
                <span class="logo-text">AlumniConnect</span>
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to continue to your dashboard.</p>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email" class="au-input" type="email" name="email" placeholder="you@example.com"
                        autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" class="au-input" type="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>
                <div class="login-checkbox">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                    <a href="forget-pass.html">Forgot password?</a>
                </div>
                <div id="loginMessage"></div>
                <button class="au-btn au-btn--green" type="submit">Sign in</button>
            </form>

            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
            </div>

        </div>
    </main>
    <script src="js/vanilla-utils.js"></script>
    <script src="vendor/bootstrap-5.3.8.bundle.min.js"></script>
    <script src="js/bootstrap5-init.js"></script>
    <script src="js/main-vanilla.js"></script>
    <script src="js/modern-plugins.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("loginMessage");

            message.textContent = "Signing in...";
            message.style.color = "#555";

            try {
                const response = await fetch("http://localhost:8080/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (!response.ok) {
                    throw new Error("Invalid email or password.");
                }

                const data = await response.json();

                // Save login information
                localStorage.setItem("token", data.token);
                localStorage.setItem("userId", data.userId);
                localStorage.setItem("firstName", data.firstName);
                localStorage.setItem("lastName", data.lastName);
                localStorage.setItem("email", data.email);
                localStorage.setItem("role", data.role);

                message.textContent = "Login successful!";
                message.style.color = "green";

                // Redirect user according to role
                setTimeout(() => {
                    if (data.role === "ADMIN") {
                        window.location.href = "index.html";
                    } else if (data.role === "ALUMNI") {
                        window.location.href = "index4.html";
                    } else {
                        message.textContent = "Unknown user role.";
                        message.style.color = "red";
                    }
                }, 800);

            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";
            }
        });
    </script>

</body>

</html>
